<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MysticLight Control Center</title>
  <style>
    :root { color-scheme: dark; font-family: system-ui, sans-serif; }
    body { background: #111827; color: #e5e7eb; margin: 0; }
    main { margin: 0 auto; max-width: 900px; padding: 2rem; }
    section { background: #1f2937; border: 1px solid #374151; border-radius: .75rem; margin: 1rem 0; padding: 1rem; }
    .ok { color: #86efac; } .warn { color: #fcd34d; }
    code, pre { white-space: pre-wrap; word-break: break-word; }
  </style>
</head>
<body>
  <main>
    <h1>MysticLight Control Center</h1>
    <p>Local provider health and capability dashboard.</p>
    <section><h2>Service health</h2><p id="health">Loading...</p></section>
    <section><h2>Providers</h2><pre id="providers">Loading...</pre></section>
    <section><h2>Safety</h2><p class="ok">Physical write operations are disabled in this interface.</p></section>
  </main>
  <script>
    async function load() {
      const health = document.getElementById('health');
      const providers = document.getElementById('providers');
      try {
        const healthResponse = await fetch('/health');
        const healthData = await healthResponse.json();
        health.textContent = healthData.status;
        health.className = healthData.status === 'ok' ? 'ok' : 'warn';
        const providerResponse = await fetch('/providers');
        providers.textContent = JSON.stringify(await providerResponse.json(), null, 2);
      } catch (error) {
        health.textContent = 'Unavailable';
        health.className = 'warn';
        providers.textContent = String(error);
      }
    }
    load();
  </script>
</body>
</html>
